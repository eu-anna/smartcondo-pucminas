<!DOCTYPE html>
<html lang="PT-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Comunicados</title>
		<link rel="stylesheet" href="../../../css/global.css" />
		<link rel="stylesheet" href="../communicates/style.css" />
		<link
			rel="stylesheet"
			href="../../../components/layoutHeader/layoutHeader.css"
		/>
		<link
			rel="icon"
			type="image/png"
			href="../../../assets/img/smart.png"
		/>
	</head>
	<body>
		<div class="container">
			<!-- Componente Sidebar -->
			<layout-sidebar role="resident"></layout-sidebar>
			<main class="content">
				<!-- Componente Header -->
				<layout-header title="Comunicados"></layout-header>

				<!-- Cadastrar minhas notificacoes -->
				<div class="records">
					<form action="">
						<div class="form-rol">
							<div class="form-group">
								<label for="title">Titulo</label>
								<input type="text" id="title" />
							</div>
							<div class="form-group">
								<label for="selectTarget">Categoria</label>
								<select
									name="category"
									id="selectTarget"
								></select>
							</div>
						</div>
						<div class="form-group">
							<label for="text">Texto</label>
							<input type="textarea" id="text" />
						</div>
						<button class="btn" id="btnNewNotification">Enviar</button>
					</form>
					<!-- Exibi apenas as notificações que o morador criou e enviou! -->
					<div class="containerList">
						<h5>Mensagens enviadas</h5>
						<button id="open">Clique para abrir</button>
						<button id="close">Clique para Fechar</button>
						<div class="myNotifications">
							<ul id="myListRender"></ul>
						</div>
					</div>
				</div>

				<div class="containerAll">
					<h3>Mensagens recebidas</h3>
					<!-- Lista de notificações -->
					<div class="containerList">
						<div class="listNotifications">
							<ul id="listRender"></ul>
						</div>
					</div>

					<!-- Menu Referencia dos icones -->
					<div class="containerList menu">
						<h3>Referência</h3>
						<div class="listNotifications">
							<ul id="listRenderMenu">
								<li></li>
							</ul>
						</div>
					</div>
				</div>
			</main>
		</div>

		<!-- Scripts -->
		<layout-bottom-nav role="resident"></layout-bottom-nav>
		<script type="module" src="./js/index.js"></script>
		<script
			type="module"
			src="../../../components/layoutNavbar/index.js"
		></script>
		<script
			type="module"
			src="../../../components/layoutNavbar/layoutBottomNav.js"
		></script>
		<script
			type="module"
			src="../../../components/layoutHeader/layoutHeader.js"
		></script>
		<script type="module" src="../../login/auth/logout.js"></script>
	</body>
</html>
