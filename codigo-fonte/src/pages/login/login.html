<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SmartCondo - Acesso</title>
		<link rel="stylesheet" href="../.././css/login-css/login.css" />
		<link rel="icon" type="image/png" href="../../assets/img/smart.png" />
	</head>

	<body>
		<div class="page-container">
			<header class="site-header">
				<div class="logo-container">
					<img
						src="../../assets/img/smart.png"
						alt="Logo da plataforma SmartCondo"
						class="header-logo"
					/>
					<span>SmartCondo</span>
				</div>
				<nav class="main-nav">
					<a href="../../../../index.html" class="home-link">Home</a>
				</nav>
			</header>

			<main>
				<div class="content-wrapper">
					<div class="illustration-side">
						<img
							src="../../assets/img/illustration.png"
							alt="Ilustração de condomínio"
							class="illustration-img"
						/>
					</div>
					<div class="form-side">
						<div class="login-form">
							<h2>Acesse sua conta</h2>
							<form>
								<label for="email" class="sr-only"
									>E-mail</label
								>
								<input
									type="email"
									id="email"
									placeholder="E-mail"
									autocomplete="email"
								/>

								<div class="password-group">
									<label for="password" class="sr-only"
										>Senha</label
									>

									<input
										type="password"
										id="password"
										placeholder="Senha"
										autocomplete="current-password"
									/>
									<button
										type="button"
										class="toggle-password"
										aria-label="Mostrar senha"
										data-target="#password"
									>
										<img
											src="https://cdn0.iconfinder.com/data/icons/ui-icons-pack/100/ui-icon-pack-14-512.png"
										/>
									</button>
								</div>

								<div class="remember-me">
									<input type="checkbox" id="lembrar" />
									<label for="lembrar">Lembrar de mim</label>
								</div>

								<button type="button" id="loginButton">
									Entrar
								</button>
							</form>
							<p class="register-info">
								Ainda não tem acesso? Fale com a administração
								do seu condomínio
							</p>
							<div class="form-footer">
								<a href="#">Suporte</a>
								<a href="#">Política de privacidade</a>
							</div>
						</div>
					</div>
				</div>
			</main>

			<footer>
				<a href="../../../../index.html#about">Sobre o SmartCondo</a>
				<span>SmartCondo © 2025 – Trabalho acadêmico PUC Minas</span>
			</footer>
		</div>
		<app-loader></app-loader>
		<script type="module" src="index.js"></script>
		<script type="module" src="../../components/loader/loader.js"></script>
	</body>
</html>
