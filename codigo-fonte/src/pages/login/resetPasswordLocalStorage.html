<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartCondo - Redefinir Senha</title>
  <link rel="stylesheet" href="../../css/login-css/login.css" />
  <link rel="icon" type="image/png" href="../../assets/img/smart.png" />
</head>

<body>
  <div class="page-container">
    <header class="site-header">
      <div class="logo-container">
        <img
          src="../../assets/img/smart.png"
          alt="Logo da plataforma SmartCondo"
          class="header-logo"
        />
        <span>SmartCondo</span>
      </div>
      <nav class="main-nav">
        <a href="../../landing/index.html" class="home-link">Home</a>
      </nav>
    </header>

    <main>
      <div class="content-wrapper">
        <div class="illustration-side">
          <img
            src="../../assets/img/illustration.png"
            alt="Ilustração de condomínio"
            class="illustration-img"
          />
        </div>
        <div class="form-side">
          <div class="login-form">
            <h2>Redefinir Senha</h2>
            <form id="resetForm">
              <label for="novaSenha" class="sr-only">Nova Senha</label>
              <input
                type="password"
                id="novaSenha"
                placeholder="Nova senha"
                autocomplete="new-password"
              />

              <label for="confirmarSenha" class="sr-only">Confirmar Senha</label>
              <input
                type="password"
                id="confirmarSenha"
                placeholder="Confirmar nova senha"
                autocomplete="new-password"
              />

              <button type="button" id="salvarSenha">Salvar Nova Senha</button>
            </form>

            <p class="register-info">
              Após alterar sua senha, você será redirecionado ao seu painel.
            </p>

            <div class="form-footer">
              <a href="#">Suporte</a>
              <a href="#">Política de privacidade</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <a href="index.html#sobre-nos">Sobre o SmartCondo</a>
      <span>SmartCondo © 2025 – Trabalho acadêmico PUC Minas</span>
    </footer>
  </div>

  <script type="module" src="../login/auth/resetPasswordLocalStorage.js"></script>
</body>
</html>
