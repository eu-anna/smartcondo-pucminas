<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Redefinir Senha</title>
		<link rel="stylesheet" href="../../css//login-css/login.css" />
	</head>
	<body>
		<style>
			label {
				display: none;
			}
			.form-side {
				height: 100vh;
			}
		</style>
		<div class="form-side">
			<div class="login-form">
				<h2>Redefina sua senha</h2>
				<form>
					<label for="email" class="sr-only">E-mail</label>
					<input
						type="email"
						id="email"
						placeholder="E-mail"
						autocomplete="email"
					/>

					<label for="novaSenha" class="sr-only">Nova senha</label>
					<input
						type="password"
						id="novaSenha"
						placeholder="Nova senha"
						autocomplete="current-password"
					/>
					<label for="confirmaSenha" class="sr-only"
						>Repita a senha</label
					>
					<input
						type="password"
						id="confirmaSenha"
						placeholder="Repita a senha"
						autocomplete="current-password"
					/>
					<button type="button" id="btnSalvar">Salvar</button>
				</form>
			</div>
		</div>
		<app-loader></app-loader>

		<script type="module" src="../../components/loader/loader.js"></script>
		<script type="module" src="./auth/resetPassword.js"></script>
	</body>
</html>
